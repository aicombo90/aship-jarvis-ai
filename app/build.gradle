plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aship.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aship.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Vosk offline speech recognition, loaded via JitPack (declared in the
    // top-level build.gradle repositories block).
    // NOTE (Phase 1): this coordinate is used as specified. If dependency
    // resolution fails in CI, the first thing to try is swapping the group to
    // 'com.github.alphacep' (the vosk-android GitHub repo lives under the
    // "alphacep" org): implementation 'com.github.alphacephei:vosk-android:0.3.47'
    implementation 'com.github.alphacephei:vosk-android:0.3.47'
}
