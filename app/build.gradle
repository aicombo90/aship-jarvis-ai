import java.util.Base64

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ---------------------------------------------------------------------
// Fixed CI signing key (Phase 2).
//
// keystore/keystore.b64 in the repo root is a base64-encoded PKCS12
// keystore holding a self-signed *CI debug* key (alias "jarvis",
// 30-year validity). It is public by design — its only job is to give
// every CI build the SAME signature, so a new APK installs over the
// old one and the app data (downloaded Vosk model, settings) survives
// updates. It is NOT a Play Store key.
//
// At configuration time the .b64 is decoded into this module's build
// dir (never committed). If the .b64 file is absent (e.g. a fresh
// local checkout without it), signing silently falls back to the
// default debug key, exactly like Phase 1.
// ---------------------------------------------------------------------
def ciKeystoreFile = null
def ciKeystoreB64 = rootProject.file('keystore/keystore.b64')
if (ciKeystoreB64.exists()) {
    ciKeystoreFile = new File(buildDir, 'ci-keystore.p12')
    ciKeystoreFile.parentFile.mkdirs()
    ciKeystoreFile.bytes = Base64.getMimeDecoder().decode(ciKeystoreB64.getText('UTF-8'))
}

// ---------------------------------------------------------------------
// v41: sherpa-onnx ka official Android AAR (Bangla offline ASR).
//
// AAR ek ~50 MB ki binary hai — is repo me file sirf text ke
// roop me ja sakti hai, isliye AAR repo me rakhne ke bajay
// build ke samay yahi script use PIN ki hui official GitHub
// release se download karke app/libs me rakhti hai, aur
// SHA-256 milakar jaanchti hai (bandha hua hash na mile to
// build wahin ruk jata hai — chup-chaap badla hua ya kharab
// AAR kabhi APK me nahi jayega). Uske baad woh ek aam local
// file dependency ki tarah judta hai (neeche dependencies me).
// ---------------------------------------------------------------------
def sherpaAarFile = file('libs/sherpa-onnx-1.13.8.aar')
def sherpaAarSha256 = '633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96'
def sherpaSha256 = { File f ->
    def md = java.security.MessageDigest.getInstance('SHA-256')
    f.withInputStream { input ->
        byte[] buf = new byte[8192]
        int n
        while ((n = input.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().collect { String.format('%02x', it & 0xff) }.join()
}
if (!sherpaAarFile.exists() || sherpaSha256(sherpaAarFile) != sherpaAarSha256) {
    sherpaAarFile.parentFile.mkdirs()
    def sherpaTmp = new File(sherpaAarFile.parentFile, sherpaAarFile.name + '.part')
    new URL('https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar')
        .withInputStream { input ->
            sherpaTmp.withOutputStream { out -> out << input }
        }
    if (sherpaSha256(sherpaTmp) != sherpaAarSha256) {
        sherpaTmp.delete()
        throw new GradleException('sherpa-onnx AAR ka SHA-256 nahi mila — download kharab hai, build roka gaya')
    }
    java.nio.file.Files.move(
        sherpaTmp.toPath(), sherpaAarFile.toPath(),
        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
}

android {
    namespace 'com.aship.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aship.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 85
        versionName '1.84'

        ndk {
            // v41: sherpa-onnx AAR chaaron ABI ke .so rakhta
            // hai (kul ~128 MB bina bandhe). Jarvis sirf ARM
            // phone par chalta hai (vivo/Samsung) — x86 wale
            // hisse APK se bahar rakho, warna APK bekaar me
            // phool jayega. Vosk ke bhi sirf ARM hisse
            // rahenge; un phones par koi badlav nahi.
            // v72: sirf arm64-v8a — armeabi-v7a (32-bit) bhi
            // hata diya. v71 APK 76.7 MB tha, usme v7a wale
            // .so (Stored, bina dabaye) 31.4 MB the; arm64
            // wala APK ~45.3 MB hoga — ~41% chhota download.
            // User ka phone vivo T4x 5G (arm64) hai — us par
            // v7a wale .so kabhi chalte hi nahi the, isliye
            // app par koi asar nahi. 32-bit ARM phone par ye
            // APK ab nahi chalega (UpdateChecker ek hi asset
            // uthata hai — aship-jarvis-vNN.apk — isliye
            // split APK ka rasta nahi liya: workflow badle
            // bina ek hi asset, wahi naam, wahi link).
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (ciKeystoreFile != null) {
            ci {
                storeFile ciKeystoreFile
                storePassword 'jarvis2026'
                keyAlias 'jarvis'
                keyPassword 'jarvis2026'
            }
        }
    }

    buildFeatures {
        // UpdateChecker ko BuildConfig.VERSION_CODE chahiye
        // (AGP 8 me BuildConfig generation pehle se band rehta hai).
        buildConfig true
    }

    buildTypes {
        debug {
            if (ciKeystoreFile != null) {
                signingConfig signingConfigs.ci
            }
        }
        release {
            minifyEnabled false
            if (ciKeystoreFile != null) {
                signingConfig signingConfigs.ci
            }
        }
    }


    // v17: APK file ke naam me hi version — Downloads list me
    // kaun sa version hai, ye naam dekh kar hi samajh aayega.
    // Workflow ka release step *.apk glob se uthata hai, isliye
    // Release asset ka naam bhi yahi hoga: aship-jarvis-v<versionCode>.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "aship-jarvis-v${variant.versionCode}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Vosk offline speech recognition, loaded via JitPack (declared in the
    // top-level build.gradle repositories block).
    // NOTE (Phase 1): this coordinate is used as specified. If dependency
    // resolution fails in CI, the first thing to try is swapping the group to
    // 'com.github.alphacep' (the vosk-android GitHub repo lives under the
    // "alphacep" org): implementation 'com.github.alphacephei:vosk-android:0.3.47'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    // v41: sherpa-onnx (Bangla offline ASR) — official AAR,
    // upar wali script build ke samay app/libs me laati hai.
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    // FileProvider: download hue update APK ko system installer tak
    // bhejne ke liye (file:// URI Android 7+ par band hai).
    implementation 'androidx.core:core:1.15.0'
}
